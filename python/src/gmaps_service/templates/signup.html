{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block body %}
<section class="panel narrow">
  <h1>Create an account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" required maxlength="200" autocomplete="email"></label>
    <label>Password <input type="password" name="password" required minlength="10" maxlength="200" autocomplete="new-password"></label>
    <label>Invite code <input type="text" name="invite" value="{{ invite }}" maxlength="80" autocomplete="off"></label>
    <p class="hint">An invite starts a 14-day trial. Without one, you can still create an account and subscribe.</p>
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="/login">Log in</a></p>
</section>
{% endblock %}

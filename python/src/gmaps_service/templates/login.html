{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<section class="panel narrow">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" required maxlength="200" autocomplete="email"></label>
    <label>Password <input type="password" name="password" required minlength="10" maxlength="200" autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}

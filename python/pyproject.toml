[project]
name = "gmaps-service"
version = "0.1.0"
description = "Hostable Google Maps business search with a Playwright engine and the Places API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gosom" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "phonenumbers>=8.13,<10",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
  "sqlalchemy>=2.0,<3",
  "bcrypt>=4.1,<6",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.12,<1",
  "stripe>=11,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pip-audit>=2.7",
  "bandit>=1.8",
  "ruff>=0.8",
]

[tool.setuptools.package-data]
gmaps_service = ["templates/*.html", "static/*", "migrations/*.sql"]

[project.scripts]
gmaps-scraper = "gmaps_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
# E501: prose and SQL lines are easier to read unbroken.
# S104: the server binds all interfaces inside a container on purpose.
# S311: random is used only for polite delays, not tokens.
ignore = ["S101", "B008", "S105", "S106", "E501", "S104", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

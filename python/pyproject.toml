[project]
name = "gmaps-service"
version = "0.1.0"
description = "Hostable Google Maps business search with a Playwright engine and the Places API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gosom" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "phonenumbers>=8.13,<10",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
gmaps-scraper = "gmaps_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
